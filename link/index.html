<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YATAI SCHOOL リンク集</title>
<meta name="theme-color" content="#f4f6fb">
<style>
:root{--navy:#15327f;--navy-ink:#1d2a4d;--gold:#f2b01e;--sub:#5d6782;--line:#dfe4f0;--card:#ffffffcc;--hi:#e6ecf8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--navy-ink);line-height:1.55;min-height:100vh;
  background:radial-gradient(1200px 600px at 20% -10%,#fff7e0 0%,transparent 60%),linear-gradient(180deg,#f7f8fc 0%,#eef2fa 100%);
  padding:max(28px,env(safe-area-inset-top)) 16px 48px}
main{max-width:430px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 6px 22px}
.who{min-width:0}
.logo{display:block;height:42px;width:auto;margin:0 0 14px}
.name{font-size:1.75rem;font-weight:800;margin:0;letter-spacing:.03em;color:var(--navy)}
.title{font-size:.86rem;color:var(--sub);margin:6px 0 0;white-space:pre-line}
.photo{width:108px;height:108px;flex:none;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px #15327f22}
.bio{font-size:.9rem;color:var(--sub);margin:-6px 6px 20px;white-space:pre-line}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.row{display:flex;align-items:stretch;gap:0}
.tab{flex:none;width:34px;margin-right:-8px;border-radius:12px 0 0 12px;background:var(--hi);border:1px solid var(--line);border-right:0;display:flex;align-items:center;justify-content:flex-start;padding-left:7px;color:var(--navy)}
.tab svg{width:16px;height:16px}
.card{flex:1;min-width:0;position:relative;display:block;background:var(--card);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:14px;padding:14px 38px 14px 16px;text-decoration:none;color:inherit;transition:transform .08s,border-color .15s,box-shadow .15s}
a.card:hover{border-color:var(--navy);box-shadow:0 2px 10px #15327f14}
a.card:active{transform:scale(.985)}
a.card::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:1.4rem;color:var(--navy);font-weight:600}
.hi .card{background:linear-gradient(135deg,#fff6dc,#ffe9a8);border-color:#f2d27a}
.hi .tab{background:#ffe9a8;border-color:#f2d27a}
.t{font-weight:700;font-size:1rem;margin:0;color:var(--navy-ink)}
.d{font-size:.8rem;color:var(--sub);margin:3px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--navy-ink);background:var(--hi);border:1px solid var(--line);border-radius:8px;padding:7px 11px;text-decoration:none}
.pill:hover{border-color:var(--navy)}
.pill svg{width:15px;height:15px}
.grp .card{padding-right:16px}
.mailbox{display:flex;align-items:center;gap:10px;padding-right:12px}
.mailbox .who2{flex:1;min-width:0}
.mailbox .d{font-size:.86rem;color:var(--navy-ink);word-break:break-all;user-select:all}
.copy{flex:none;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-size:.76rem;font-weight:700;border-radius:10px;padding:8px 10px;cursor:pointer;line-height:1.3;max-width:9.5em}
.copy.done{background:#fff;color:var(--navy)}
footer{text-align:center;font-size:.72rem;color:var(--sub);margin-top:34px}
footer a{color:inherit}
.hide{display:none!important}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:4px;background:#ffffffd9;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:3px;z-index:10}
.lang button{border:0;background:none;font:inherit;font-size:.78rem;font-weight:700;color:var(--sub);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
</style>
</head>
<body>
<nav class="lang" aria-label="Language">
  <button type="button" data-lang="ja" lang="ja">日本語</button>
  <button type="button" data-lang="en" lang="en">EN</button>
  <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
</nav>
<main>
  <header>
    <div class="who">
      <img class="logo" id="logo" src="https://yatai-school.org/wp-content/uploads/2024/06/White_screen.png" alt="YATAI SCHOOL" onerror="if(this.src!=='https://yatai-school.org/wp-content/uploads/2024/06/White_screen.png')this.src='https://yatai-school.org/wp-content/uploads/2024/06/White_screen.png'">
      <h1 class="name" id="name"></h1>
      <p class="title" id="title"></p>
    </div>
    <img class="photo hide" id="photo" alt="">
  </header>
  <p class="bio hide" id="bio"></p>
  <ul id="links"></ul>
  <footer id="foot">一般社団法人カンボジア YATAI SCHOOL</footer>
</main>
<script>
/* 中身の編集は Google スプレッドシートで行う。下の FALLBACK は読み込めなかった時の控え。 */
var SHEET_ID = "1C-6ju-JZ2Y0RAB4ESd_7rWJfR6THV-_qDhO83A8GZM4";
var CACHE_KEY = "yatai-card-v5";
// 列: 種類, 表示名, 説明, URL, アイコン, 強調, 表示する, 表示名(英語), 説明(英語), 表示名(中国語), 説明(中国語)
var FALLBACK = [
  ["ロゴ","","","https://yatai-school.org/wp-content/uploads/2024/06/White_screen.png","","","○"],
  ["名前","東川 竜太","","","","","○","Ryuta Higashikawa","","東川 竜太",""],
  ["肩書き","NGO YATAI for Children Organization","","","","","○"],
  ["肩書き","YATAI SCHOOL 校長","","","","","○","Principal, YATAI SCHOOL","","YATAI SCHOOL 校长",""],
  ["リンク","動画でわかる YATAI SCHOOL","チャンネル登録よろしくお願いします","https://www.youtube.com/@YATAI_arrows","youtube","○","○","YATAI SCHOOL on YouTube","Please subscribe to our channel","视频了解 YATAI SCHOOL","欢迎订阅我们的频道"],
  ["リンク","公式 webサイト","","https://yatai-school.org/","web","","○","Official Website","","官方网站",""],
  ["リンク","公式LINE","","https://line.me/R/ti/p/@557uooum","line","","○","Official LINE","","官方 LINE",""],
  ["リンク","メールを送る","","mailto:contactcambodia@yatai-school.org","mail","","○","Send an Email","","发送邮件",""]
];
var UI = {
  ja:{foot:"一般社団法人カンボジア YATAI SCHOOL", title:"YATAI SCHOOL リンク集", html:"ja", copy:"メールアドレスをコピー", copied:"コピーしました"},
  en:{foot:"Cambodia YATAI SCHOOL", title:"YATAI SCHOOL Links", html:"en", copy:"Copy email address", copied:"Copied"},
  zh:{foot:"一般社团法人 柬埔寨 YATAI SCHOOL", title:"YATAI SCHOOL 链接", html:"zh-Hans", copy:"复制邮箱地址", copied:"已复制"}
};
var LANG = (function(){
  var m = location.search.match(/[?&]lang=(ja|en|zh)/), v = m ? m[1] : "";
  try { v = v || localStorage.getItem("yatai-lang") || ""; } catch(e) {}
  if (!v) { var n = (navigator.language || "ja").toLowerCase(); v = n.indexOf("ja") === 0 ? "ja" : n.indexOf("zh") === 0 ? "zh" : "en"; }
  return v;
})();
var LAST_ROWS = null;

var P = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
var ICONS = {
  line:'<path d="M21 11.5c0 4.1-4 7.5-9 7.5-.9 0-1.8-.1-2.6-.3L5 20.5l1-3.4C4.2 15.8 3 13.8 3 11.5 3 7.4 7 4 12 4s9 3.4 9 7.5z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3 3-5 6-5s5.4 2 6 5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.3c1.6.7 2.7 2.4 3 4.7"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  youtube:'<rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="m10 9.5 5 2.5-5 2.5z"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>',
  facebook:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  map:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  heart:'<path d="M12 20s-7-4.4-9-9.2C1.7 7.3 4 4 7.3 4c2 0 3.6 1.1 4.7 2.8C13.1 5.1 14.7 4 16.7 4 20 4 22.3 7.3 21 10.8 19 15.6 12 20 12 20z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
};
var ALIAS = {"ライン":"line","メール":"mail","サイト":"web","web":"web","人":"people","本":"book","動画":"video","電話":"phone","地図":"map","寄付":"heart","予定":"calendar"};
function icon(name){
  name = String(name||"").trim(); name = ALIAS[name] || name.toLowerCase();
  return '<svg viewBox="0 0 24 24" '+P+'>'+(ICONS[name]||ICONS.link)+'</svg>';
}
function safeUrl(u){
  u = String(u||"").trim();
  if (/^(https?:\/\/|mailto:|tel:)/i.test(u)) return u;
  if (/^[\w.\-\/]+\.(png|jpe?g|webp|svg|gif)$/i.test(u)) return u; // 同じ場所に置いた画像
  return "";
}
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function on(v){ v=String(v==null?"":v).trim(); return v!=="" && v!=="false" && v!=="FALSE" && v!=="×" && v!=="0"; }

function render(rows){
  LAST_ROWS = rows;
  var ui = UI[LANG] || UI.ja;
  document.documentElement.lang = ui.html;
  document.getElementById("foot").textContent = ui.foot;
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false"); });
  var list = document.getElementById("links"); list.textContent = "";
  var bio = document.getElementById("bio"), photo = document.getElementById("photo"), logo = document.getElementById("logo");
  bio.classList.add("hide"); photo.classList.add("hide");
  var titleEl = document.getElementById("title"), titles = [];
  var group = null;
  rows.forEach(function(r){
    var kind=String(r[0]||"").trim(), label=String(r[1]||"").trim(), desc=String(r[2]||"").trim(),
        url=safeUrl(r[3]), ic=r[4], hi=on(r[5]), show=on(r[6]);
    var off = LANG === "en" ? 7 : LANG === "zh" ? 9 : -1;
    if (off > 0) {
      var tl = String(r[off]||"").trim(), td = String(r[off+1]||"").trim();
      if (tl) { label = tl; desc = td; } // 訳が無い行は日本語のまま
    }
    if (kind !== "小ボタン") group = null;
    if (!show) return;
    if (kind === "名前") { document.getElementById("name").textContent = label; document.title = label + "｜" + UI[LANG].title; }
    else if (kind === "肩書き") titles.push(label);
    else if (kind === "紹介文") { bio.textContent = label; bio.classList.toggle("hide", !label); }
    else if (kind === "ロゴ") { if (url) logo.src = url; }
    else if (kind === "写真") { if (url) { photo.src = url; photo.alt = label; photo.classList.remove("hide"); } }
    else if (kind === "リンク" || kind === "グループ") {
      if (!label || (kind === "リンク" && !url)) return;
      var li = el("li", "row" + (hi ? " hi" : "") + (kind === "グループ" ? " grp" : ""));
      var tab = el("span", "tab"); tab.innerHTML = icon(ic); li.appendChild(tab);
      if (kind === "リンク" && /^mailto:/i.test(url)) { // メールはアプリを開かず、アドレス表示＋コピー
        var addr = url.replace(/^mailto:/i, "").split("?")[0];
        var box = el("div", "card mailbox"), who = el("div", "who2");
        who.appendChild(el("p", "t", label)); who.appendChild(el("p", "d", addr)); box.appendChild(who);
        var btn = el("button", "copy", ui.copy); btn.type = "button"; btn.setAttribute("data-addr", addr);
        box.appendChild(btn); li.appendChild(box); list.appendChild(li); return;
      }
      var card = el(kind === "リンク" ? "a" : "div", "card");
      if (kind === "リンク") { card.href = url; if (/^https?:/i.test(url)) { card.target = "_blank"; card.rel = "noopener"; } }
      card.appendChild(el("p", "t", label));
      if (desc) card.appendChild(el("p", "d", desc));
      li.appendChild(card); list.appendChild(li);
      if (kind === "グループ") { group = { li: li, box: el("div", "pills") }; card.appendChild(group.box); }
    }
    else if (kind === "小ボタン") {
      if (!group || !label || !url) return;
      var a = el("a", "pill"); a.href = url; if (/^https?:/i.test(url)) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = icon(ic); a.appendChild(document.createTextNode(label));
      group.box.appendChild(a);
    }
  });
  titleEl.textContent = titles.join("\n");
  // 小ボタンが1つも無いグループは隠す
  Array.prototype.forEach.call(list.querySelectorAll(".grp"), function(li){ if (!li.querySelector(".pill")) li.remove(); });
}
window.yataiLinks = function(resp){
  try {
    var rows = (resp.table.rows||[]).map(function(row){ return (row.c||[]).map(function(c){ return c && c.v != null ? c.v : ""; }); });
    if (!rows.length) return;
    render(rows);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); } catch(e) {}
  } catch(e) {}
};
document.querySelector(".lang").addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("button[data-lang]");
  if (!b || b.getAttribute("data-lang") === LANG) return;
  LANG = b.getAttribute("data-lang");
  try { localStorage.setItem("yatai-lang", LANG); } catch(e) {}
  render(LAST_ROWS || FALLBACK);
  track("lang", LANG);
});
/* ---- 流入経路の計測（Cookie なし・個人を特定しない） ----
   QR やSNSに載せるURLに ?s=経路名 を付ける（例 ?s=card = 名刺）。
   開いた時と各ボタンを押した時に hit.gif へ記録し、サーバーのログを集計する。 */
var SRC = (function(){
  var m = location.search.match(/[?&]s=([\w\-]{1,32})/);
  var s = m ? m[1] : "";
  try {
    if (s) sessionStorage.setItem("yatai-src", s); else s = sessionStorage.getItem("yatai-src") || "";
  } catch(e) {}
  if (!s) {
    var r = ""; try { r = document.referrer ? new URL(document.referrer).hostname : ""; } catch(e) {}
    s = r && r !== location.hostname ? "ref:" + r : "direct";
  }
  if (m && history.replaceState) history.replaceState(null, "", location.pathname); // 共有された時に経路が引き継がれないよう消す
  return s;
})();
// 記録先: GitHub Pages 等に置く時は VPS 側の hit.gif を指す（そこで nginx ログに残る）
var HIT_URL = "https://share.crazy-ai-orchestra.com/yatai/hit.gif";
function copyText(t, btn){
  function ok(){ var u = UI[LANG] || UI.ja; btn.textContent = u.copied; btn.classList.add("done");
    setTimeout(function(){ btn.textContent = u.copy; btn.classList.remove("done"); }, 2000); }
  function legacy(){ var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand("copy"); } catch(e) {} document.body.removeChild(ta); ok(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, legacy); else legacy();
}
function track(ev, to){
  var q = HIT_URL + "?e=" + ev + "&s=" + encodeURIComponent(SRC) + (to ? "&to=" + encodeURIComponent(to) : "") + "&t=" + Date.now();
  try { if (navigator.sendBeacon && navigator.sendBeacon(q)) return; } catch(e) {}
  (new Image()).src = q;
}
document.getElementById("links").addEventListener("click", function(e){
  var c = e.target.closest && e.target.closest("button.copy");
  if (c) { copyText(c.getAttribute("data-addr"), c); track("click", "copy-email"); return; }
  var a = e.target.closest && e.target.closest("a");
  if (a) track("click", (a.querySelector(".t") || a).textContent.trim().slice(0, 40));
});
track("view");

(function(){
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(e) {}
  render(cached || FALLBACK);
  var s = document.createElement("script");
  s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?headers=1&tqx=responseHandler:yataiLinks;out:json&t=" + Date.now();
  s.async = true; document.body.appendChild(s);
})();
</script>
</body>
</html>
