<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ryuta Higashikawa｜YATAI SCHOOL</title>
<meta name="theme-color" content="#f4f6fb">
<style>
:root{--navy:#15327f;--navy-ink:#1d2a4d;--gold:#f2b01e;--sub:#5d6782;--line:#dfe4f0;--card:#ffffffb8;--hi:#e6ecf8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--navy-ink);line-height:1.5;
  background:radial-gradient(1200px 600px at 20% -10%,#fff7e0 0%,transparent 60%),linear-gradient(180deg,#f7f8fc 0%,#eef2fa 100%);overflow-x:hidden}
main{position:relative;max-width:430px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  padding:max(27px,calc(env(safe-area-inset-top) + 15px)) 14px max(12px,env(safe-area-inset-bottom))}
.stage{position:relative;z-index:0}
.sil{position:absolute;right:8px;top:0;height:240px;width:auto;z-index:-1;pointer-events:none}
.brand{display:flex;align-items:center;min-height:52px;margin:4px 0 10px}
.logo{display:block;width:56px;height:auto;flex:none}
.titles{list-style:none;margin:0 0 15px;padding:0;display:grid;gap:3px;min-width:0}
.titles li{display:flex;align-items:baseline;gap:6px;font-size:.7rem;line-height:1.3;color:var(--navy-ink)}
.titles .flag{font-size:.95rem;line-height:1;flex:none;transform:translateY(2px)}
.titles b{font-weight:700}
.titles span.role{color:var(--navy);font-weight:800;white-space:nowrap}
.name{font-size:1.7rem;font-weight:800;margin:0;letter-spacing:.03em;color:var(--navy);line-height:1.2;display:inline-block;padding-bottom:5px;border-bottom:1px solid var(--navy)}
.name-ja{font-size:.88rem;font-weight:600;color:var(--sub);margin:5px 0 11px;letter-spacing:.08em}
.photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px #15327f22}
.bio{font-size:.85rem;color:var(--sub);margin:0 4px 12px;white-space:pre-line}
ul.links{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:stretch}
.tab{flex:none;width:32px;margin-right:-8px;border-radius:12px 0 0 12px;background:#e6ecf8cc;border:1px solid var(--line);border-right:0;display:flex;align-items:center;padding-left:7px;color:var(--navy)}
.tab svg{width:15px;height:15px}
.card{flex:1;min-width:0;position:relative;display:block;background:var(--card);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:14px;padding:10px 34px 10px 14px;text-decoration:none;color:inherit;transition:transform .08s,border-color .15s,box-shadow .15s}
.card{padding-right:14px}
.row{transition:transform .18s cubic-bezier(.3,.7,.3,1)}
.row .card{transition:border-color .15s,box-shadow .15s,filter .1s}
@media (hover:hover){.row:hover{transform:scale(1.025)} .row:hover .card{border-color:var(--navy);box-shadow:0 6px 16px #15327f1f}}
.row:has(a.card:active){transform:scale(.965) translateY(2px);transition-duration:.06s}
.row:has(a.card:active) .card{box-shadow:inset 0 2px 7px #15327f2b;filter:brightness(.96)}
.hi .card{background:linear-gradient(135deg,#fff6dccc,#ffe9a8cc);border-color:#f2d27a}
.hi .tab{background:#ffe9a8cc;border-color:#f2d27a}
.t{font-weight:700;font-size:.95rem;margin:0;color:var(--navy-ink)}
.d{font-size:.74rem;color:var(--sub);margin:2px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--navy-ink);background:var(--hi);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-decoration:none}
.pill{transition:transform .15s cubic-bezier(.3,.7,.3,1),box-shadow .15s,border-color .15s}
@media (hover:hover){.pill:hover{border-color:var(--navy);transform:scale(1.08);box-shadow:0 4px 10px #15327f22}}
.pill:active{transform:scale(.9) translateY(1px);box-shadow:inset 0 2px 5px #15327f33;transition-duration:.06s}
.pill svg{width:15px;height:15px}
.grp .card{padding-right:14px}
.site .card{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px}
.site .t{flex:1}
.site .pills{margin:0;flex:none}
.site .pill{padding:3px 10px;border-radius:10px;background:#fff}
.site .pill .flag{font-size:1.4rem;line-height:1}
.mailbox{display:flex;align-items:center;gap:8px;padding-right:10px}
.mailbox .who2{flex:1;min-width:0}
.mailbox .d{font-size:.8rem;color:var(--navy-ink);word-break:break-all;user-select:all}
.copy{flex:none;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-size:.74rem;font-weight:700;border-radius:10px;padding:7px 10px;cursor:pointer;line-height:1.2}
.copy{transition:transform .15s cubic-bezier(.3,.7,.3,1),box-shadow .15s}
@media (hover:hover){.copy:hover{transform:scale(1.06);box-shadow:0 4px 10px #15327f33}}
.copy:active{transform:scale(.9) translateY(1px);box-shadow:inset 0 2px 6px #0005;transition-duration:.06s}
.copy.done{background:#fff;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--navy);color:#fff;font-size:.85rem;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px #15327f40;transition:opacity .2s,transform .25s cubic-bezier(.3,.7,.3,1);z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.lang{position:absolute;top:max(27px,calc(env(safe-area-inset-top) + 15px));right:12px;display:flex;gap:4px;background:#ffffffd9;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:3px;z-index:10}
.lang button{position:relative;z-index:1;border:0;background:none;font:inherit;padding:5px 8px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center}
.lang .flag{font-size:1.35rem;line-height:1}
.lang .ring{position:absolute;left:0;top:3px;border-radius:999px;background:#e6ecf8;box-shadow:inset 0 0 0 2px var(--navy);transition:transform .28s cubic-bezier(.3,.7,.3,1),width .28s;pointer-events:none}
/* 写真カルーセル */
.gallery{position:relative;flex:1 1 auto;min-height:126px;margin:10px -14px 0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.gallery.drag{cursor:grabbing}
.slide{position:absolute;left:50%;top:50%;border-radius:14px;overflow:hidden;background:#dfe4f0 center/cover no-repeat;box-shadow:0 8px 22px #15327f2e;will-change:transform,filter,opacity}
.slide img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.slide .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 6px #0003}
.slide .ph b{font-size:2rem;line-height:1}
.slide .ph small{font-size:.7rem;opacity:.9;margin-top:4px}
.dots{display:flex;justify-content:center;gap:5px;margin:6px 0 0}
.dots i{width:5px;height:5px;border-radius:50%;background:#c9d1e6;transition:background .2s,transform .2s}
.dots i.on{background:var(--navy);transform:scale(1.3)}
</style>
</head>

  heart:'<path d="M12 20s-7-4.4-9-9.2C1.7 7.3 4 4 7.3 4c2 0 3.6 1.1 4.7 2.8C13.1 5.1 14.7 4 16.7 4 20 4 22.3 7.3 21 10.8 19 15.6 12 20 12 20z"/>',

};
var ALIAS = {"ライン":"line","メール":"mail","サイト":"web","web":"web","人":"people","本":"book","動画":"video","電話":"phone","地図":"map","寄付":"heart","予定":"calendar"};
function icon(name){
  name = String(name||"").trim(); name = ALIAS[name] || name.toLowerCase();
  return '<svg viewBox="0 0 24 24" '+P+'>'+(ICONS[name]||ICONS.link)+'</svg>';
}
function safeUrl(u){
  u = String(u||"").trim();
  if (/^(https?:\/\/|mailto:|tel:)/i.test(u)) return u;
  if (/^[\w.\-\/]+\.(png|jpe?g|webp|svg|gif)$/i.test(u)) return u; // 同じ場所に置いた画像
  return "";
}
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function on(v){ v=String(v==null?"":v).trim(); return v!=="" && v!=="false" && v!=="FALSE" && v!=="×" && v!=="0"; }

function render(rows){
  LAST_ROWS = rows;
  var ui = UI[LANG] || UI.ja;
  document.documentElement.lang = ui.html;
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false"); });
  moveRing();
  var list = document.getElementById("links"); list.textContent = "";
  var titles = document.getElementById("titles"); titles.textContent = "";
  var bio = document.getElementById("bio"), photo = document.getElementById("photo"), logo = document.getElementById("logo");
  bio.classList.add("hide"); photo.classList.add("hide");
  var group = null, photos = [];
  rows.forEach(function(r){
    var kind=String(r[0]||"").trim(), label=String(r[1]||"").trim(), desc=String(r[2]||"").trim(),
        url=safeUrl(r[3]), ic=String(r[4]||"").trim(), hi=on(r[5]), show=on(r[6]);
    var off = LANG === "en" ? 7 : LANG === "zh" ? 9 : -1;
    if (off > 0) {
      var tl = String(r[off]||"").trim(), td = String(r[off+1]||"").trim();
      if (tl) { label = tl; desc = td; } // 訳が無い行は日本語のまま
    }
    if (kind !== "小ボタン" && kind !== "サイトボタン") group = null;
    if (!show) return;
    if (kind === "名前") { // 日本語・中国語ページは漢字を大きく、英語ページはローマ字を大きく。もう一方を下に小さく
      var ja = String(r[1]||"").trim(), en = String(r[7]||"").trim() || ja, big = LANG === "en" ? en : ja, small = LANG === "en" ? ja : en;
      var nm = document.getElementById("name"), sub = document.getElementById("nameja");
      nm.textContent = big; nm.lang = LANG === "en" ? "en" : "ja";
      sub.textContent = small !== big ? small : ""; sub.lang = LANG === "en" ? "ja" : "en";
      document.title = big + "｜" + ui.title; }
    else if (kind === "肩書き") {
      var li0 = el("li"); if (ic) li0.appendChild(el("span", "flag", ic));
      var tx = el("span"); tx.appendChild(el("b", "", label));
      if (desc) { tx.appendChild(document.createTextNode(" ")); tx.appendChild(el("span", "role", desc)); }
      li0.appendChild(tx); titles.appendChild(li0); }
    else if (kind === "紹介文") { bio.textContent = label; bio.classList.toggle("hide", !label); }
    else if (kind === "ロゴ") { if (url) logo.src = url; }
    else if (kind === "写真") { if (url) { photo.src = url; photo.alt = label; photo.classList.remove("hide"); } }
    else if (kind === "写真集") { if (url) photos.push({src: url, alt: label}); }
    else if (kind === "リンク" || kind === "グループ" || kind === "サイト") {
      if (!label || (kind === "リンク" && !url)) return;
      var li = el("li", "row" + (hi ? " hi" : "") + (kind === "グループ" ? " grp" : kind === "サイト" ? " grp site" : ""));
      var tab = el("span", "tab"); tab.innerHTML = icon(ic); li.appendChild(tab);
      if (kind === "リンク" && /^mailto:/i.test(url)) { // メールはアプリを開かず、アドレス表示＋コピー
        var addr = url.replace(/^mailto:/i, "").split("?")[0];
        var box = el("div", "card mailbox"), who = el("div", "who2");
        who.appendChild(el("p", "t", label)); who.appendChild(el("p", "d", addr)); box.appendChild(who);
        var btn = el("button", "copy", ui.copy); btn.type = "button"; btn.setAttribute("data-addr", addr);
        box.appendChild(btn); li.appendChild(box); list.appendChild(li); return;
      }
      var card = el(kind === "リンク" ? "a" : "div", "card");
      if (kind === "リンク") { card.href = url; if (/^https?:/i.test(url)) { card.target = "_blank"; card.rel = "noopener"; } }
      card.appendChild(el("p", "t", label));
      if (desc) card.appendChild(el("p", "d", desc));
      li.appendChild(card); list.appendChild(li);
      if (kind === "グループ" || kind === "サイト") { group = { li: li, box: el("div", "pills") }; card.appendChild(group.box); }
    }
    else if (kind === "サイトボタン") { // 公式サイトの右に並ぶ国旗ボタン。表示名=国旗、説明=読み上げ名
      if (!group || !url) return;
      var f = el("a", "pill"); f.href = url; f.target = "_blank"; f.rel = "noopener";
      f.setAttribute("aria-label", desc); f.title = desc;
      f.appendChild(el("span", "flag", String(r[1]||"").trim())); f.setAttribute("data-track", "site-" + (String(r[2]||"").trim() || "x"));
      group.box.appendChild(f);
    }
    else if (kind === "小ボタン") {
      if (!group || !label || !url) return;
      var a = el("a", "pill"); a.href = url; if (/^https?:/i.test(url)) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = icon(ic); a.appendChild(document.createTextNode(label));
      group.box.appendChild(a);
    }
  });
  Array.prototype.forEach.call(list.querySelectorAll(".grp"), function(li){ if (!li.querySelector(".pill")) li.remove(); });
  GALLERY.set(photos);
  placeSil();
}
function safeUrl(u){
  u = String(u||"").trim();
  if (/^(https?:\/\/|mailto:|tel:)/i.test(u)) return u;
  if (/^[\w.\-\/]+\.(png|jpe?g|webp|svg|gif)$/i.test(u)) return u; // 同じ場所に置いた画像
  return "";
}
function moveRing(){ // 選択中の国旗へ青い丸枠を移動
  var nav = document.querySelector(".lang"), ring = nav.querySelector(".ring"), b = nav.querySelector('button[data-lang="' + LANG + '"]');
  if (!ring || !b) return;
  ring.style.width = b.offsetWidth + "px"; ring.style.height = b.offsetHeight + "px";
  ring.style.top = b.offsetTop + "px"; ring.style.transform = "translateX(" + b.offsetLeft + "px)";
}
function placeSil(){ // イラストを右側に。頭はロゴの高さ、足は最初のボタンに少し掛かる
  var sil = document.getElementById("sil"), brand = document.querySelector(".brand"), first = document.querySelector("#links > li");
  if (!sil || !brand) return;
  var nav = document.querySelector(".lang"), stage = document.getElementById("stage");
  var top = Math.max(0, nav.offsetTop + nav.offsetHeight + 4 - stage.offsetTop), bottom = first ? first.offsetTop + first.offsetHeight * .6 : top + 280;
  sil.style.top = top + "px"; sil.style.height = Math.max(120, bottom - top) + "px";
}

/* ---- 写真カルーセル（中央が大きくカラー、前後は後ろに重なって薄く） ---- */
var GALLERY = (function(){
  var root = document.getElementById("gallery"), dots = document.getElementById("dots");
  var items = [], n = 0, pos = 0, target = 0, W = 200, H = 150, raf = 0, key = "";
  var HUES = [12, 38, 200, 150, 280, 330, 190, 60, 100, 230, 20, 170, 260, 300, 80];
  function wrap(d){ if (n < 2) return d; d = ((d % n) + n) % n; return d > n / 2 ? d - n : d; }
  function size(){
    var cw = root.clientWidth, ch = root.clientHeight;
    W = Math.min(cw * .62, ch * .9 * 4 / 3); H = W * .75;
    items.forEach(function(it){ it.style.width = W + "px"; it.style.height = H + "px"; it.style.marginLeft = -W / 2 + "px"; it.style.marginTop = -H / 2 + "px"; });
    layout();
  }
  function layout(){
    var R = root.clientWidth * .44, cur = Math.round(wrap(pos) + n) % (n || 1);
    items.forEach(function(it, i){
      var d = wrap(i - pos), ad = Math.abs(d);
      if (ad > 3.4) { it.style.visibility = "hidden"; return; }
      it.style.visibility = "visible";
      var ang = Math.max(-1.75, Math.min(1.75, d * .62));
      var x = Math.sin(ang) * R, s = Math.pow(.8, ad);
      it.style.transform = "translateX(" + x.toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
      it.style.zIndex = String(100 - Math.round(ad * 10));
      it.style.opacity = String(Math.max(0, Math.min(1, (3.4 - ad) / .9)).toFixed(3));
      it.style.filter = ad < .02 ? "none" : "saturate(" + Math.max(0, 1 - ad * .4).toFixed(2) + ") contrast(" + (1 - ad * .12).toFixed(2) + ") brightness(" + (1 + ad * .1).toFixed(2) + ")";
    });
    Array.prototype.forEach.call(dots.children, function(dt, i){ dt.classList.toggle("on", i === cur); });
  }
  function tick(){
    var diff = target - pos;
    if (Math.abs(diff) < .002) { pos = target; layout(); raf = 0; return; }
    pos += diff * .14; layout(); raf = requestAnimationFrame(tick);
  }
  function go(t){ target = t; if (!raf) raf = requestAnimationFrame(tick); }
  function set(list){
    var ph = !list.length;
    if (ph) for (var k = 0; k < 15; k++) list.push({ph: k + 1});
    var nk = JSON.stringify(list); if (nk === key) return; key = nk;
    root.textContent = ""; dots.textContent = ""; items = []; n = list.length;
    list.forEach(function(p, i){
      var it = el("div", "slide");
      if (p.ph) { var h = HUES[i % HUES.length], box = el("div", "ph");
        box.style.background = "linear-gradient(135deg,hsl(" + h + " 70% 62%),hsl(" + (h + 40) + " 65% 45%))";
        box.appendChild(el("b", "", String(p.ph))); box.appendChild(el("small", "", "PHOTO")); it.appendChild(box); }
      else { var im = el("img"); im.src = p.src; im.alt = p.alt || ""; im.loading = i < 4 || i > n - 4 ? "eager" : "lazy"; im.draggable = false; it.appendChild(im); }
      it.setAttribute("data-i", i); items.push(it); root.appendChild(it); dots.appendChild(el("i"));
    });
    pos = target = 0; size();
  }
  // 指・マウスで左右に動かす（はじくと慣性で流れる）
  var down = false, sx = 0, sp = 0, lx = 0, lt = 0, v = 0, moved = 0;
  root.addEventListener("pointerdown", function(e){ if (n < 2) return; down = true; moved = 0; sx = lx = e.clientX; lt = performance.now(); v = 0; sp = pos; cancelAnimationFrame(raf); raf = 0; root.classList.add("drag"); try { root.setPointerCapture(e.pointerId); } catch(_) {} });
  root.addEventListener("pointermove", function(e){ if (!down) return; var now = performance.now(), step = W * .62;
    moved = Math.max(moved, Math.abs(e.clientX - sx)); pos = target = sp - (e.clientX - sx) / step;
    if (now > lt) v = .8 * v + .2 * (-(e.clientX - lx) / step) / (now - lt) * 1000; lx = e.clientX; lt = now; layout(); });
  function up(e){ if (!down) return; down = false; root.classList.remove("drag");
    if (moved < 6) { var hit = document.elementFromPoint(e.clientX, e.clientY), s = hit && hit.closest && hit.closest(".slide"); if (s) go(pos + wrap(+s.getAttribute("data-i") - pos)); else go(Math.round(pos)); return; }
    go(Math.round(pos + Math.max(-4, Math.min(4, v * .28)))); track("swipe"); }
  root.addEventListener("pointerup", up); root.addEventListener("pointercancel", up);
  root.addEventListener("wheel", function(e){ if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; e.preventDefault();
    pos = target = pos + e.deltaX / (W * .9); layout(); clearTimeout(root._w); root._w = setTimeout(function(){ go(Math.round(pos)); }, 120); }, {passive: false});
  window.addEventListener("resize", size);
  return { set: set, size: size };
})();

window.addEventListener("resize", function(){ moveRing(); placeSil(); });
window.yataiLinks = function(resp){
  try {
    var rows = (resp.table.rows||[]).map(function(row){ return (row.c||[]).map(function(c){ return c && c.v != null ? c.v : ""; }); });
    if (!rows.length) return;
    render(rows);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); } catch(e) {}
  } catch(e) {}
};
document.querySelector(".lang").addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("button[data-lang]");
  if (!b || b.getAttribute("data-lang") === LANG) return;
  LANG = b.getAttribute("data-lang");
  try { localStorage.setItem("yatai-lang", LANG); } catch(e) {}
  render(LAST_ROWS || FALLBACK);
  track("lang", LANG);
});
/* ---- 流入経路の計測（Cookie なし・個人を特定しない） ----
   QR やSNSに載せるURLに ?s=経路名 を付ける（例 ?s=card = 名刺）。
   開いた時と各ボタンを押した時に hit.gif へ記録し、サーバーのログを集計する。 */
var SRC = (function(){
  var m = location.search.match(/[?&]s=([\w\-]{1,32})/);
  var s = m ? m[1] : "";
  try {
    if (s) sessionStorage.setItem("yatai-src", s); else s = sessionStorage.getItem("yatai-src") || "";
  } catch(e) {}
  if (!s) {
    var r = ""; try { r = document.referrer ? new URL(document.referrer).hostname : ""; } catch(e) {}
    s = r && r !== location.hostname ? "ref:" + r : "direct";
  }
  if (m && history.replaceState) history.replaceState(null, "", location.pathname); // 共有された時に経路が引き継がれないよう消す
  return s;
})();
// 記録先: VPS 側の hit.gif（そこで nginx ログに残る）。確認用ページ（/preview/）では記録しない
var HIT_URL = /\/preview\//.test(location.pathname) ? "" : "https://share.crazy-ai-orchestra.com/yatai/hit.gif";
function copyText(t, btn){
  function ok(){ var u = UI[LANG] || UI.ja; btn.textContent = u.copied; btn.classList.add("done"); toast(u.toast);
    setTimeout(function(){ btn.textContent = u.copy; btn.classList.remove("done"); }, 2000); }
  function legacy(){ var ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand("copy"); } catch(e) {} document.body.removeChild(ta); ok(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, legacy); else legacy();
}
function toast(msg){ // 画面下に「コピーしました」を短く出す
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
document.addEventListener("touchstart", function(){}, {passive: true}); // iPhone で押した時の沈み込み(:active)を効かせる
function track(ev, to){
  if (!HIT_URL) return;
  var q = HIT_URL + "?e=" + ev + "&s=" + encodeURIComponent(SRC) + (to ? "&to=" + encodeURIComponent(to) : "") + "&t=" + Date.now();
  try { if (navigator.sendBeacon && navigator.sendBeacon(q)) return; } catch(e) {}
  (new Image()).src = q;
}
document.getElementById("links").addEventListener("click", function(e){
  var c = e.target.closest && e.target.closest("button.copy");
  if (c) { copyText(c.getAttribute("data-addr"), c); track("click", "copy-email"); return; }
  var a = e.target.closest && e.target.closest("a");
  if (a) track("click", a.getAttribute("data-track") || (a.querySelector(".t") || a).textContent.trim().slice(0, 40));
});
track("view");

(function(){
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(e) {}
  render(cached || FALLBACK);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ moveRing(); placeSil(); GALLERY.size(); });
  var s = document.createElement("script");
  s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?headers=1&tqx=responseHandler:yataiLinks;out:json&t=" + Date.now();
  s.async = true; document.body.appendChild(s);
})();
